name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Разложить файлы по папкам
        run: |
          mkdir -p src/main/java/ru/goodbadworld/board src/main/resources
          mv GoodBadBoard.java src/main/java/ru/goodbadworld/board/
          mv plugin.yml config.yml src/main/resources/

      - name: Сборка
        run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: GoodBadBoard
          path: target/GoodBadBoard.jar
